<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify Code</title>
   <link rel="manifest" href="/static/manifest.webmanifest">
   <meta name="theme-color" content="#708238">
   <link rel="stylesheet" href="/static/modern-clinic.css?v=19">
</head>
<body>
    <h1>Enter the Verification Code</h1>
    <form action="{{ url_for('verify', phone_number=phone_number) }}" method="post">
        <label for="verification_code">Verification Code:</label>
        <input type="text" name="verification_code" id="verification_code" required>
        <button type="submit">Verify</button>
    </form>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
<script src="/static/modern-clinic.js?v=19"></script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("/service-worker.js"); }); }</script>
</body>
</html>
