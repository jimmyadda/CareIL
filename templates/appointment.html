            </div>
            <div class="modal-body">
               <form data-parsley-validate="" novalidate="" class="form-horizontal" id="detailform">
                           <div class="form-group">
                              <label key="patient" class="col-lg-2 control-label translate EN">Client</label>
                              <div class="col-lg-10">

                              </div>
                           </div>

                  <div class="form-group">
                              <label key="appdate" class="col-lg-2 control-label translate EN">Appointment date</label>

                                     <div class="col-lg-10">
                           <input id="datepicker1" size="16" type="text" name="appointment_date" required class="form-control form_datetime" value="">
</div>

                           </div>



                        </form>



            </div>
