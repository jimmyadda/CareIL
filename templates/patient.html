               <!-- START Language list-->

               <!-- END Language list    -->
               Clients
               <small data-localize="dashboard.WELCOME"></small>
                <div id="pullcss" class="pull-right">
                  <div class="btn-group">
                     <button key="addpatbtn" style="bottom: 27px;" id="addpatient" class="mb-sm btn btn-primary translate EN" type="button">Add client</button>

                  </div>
               </div>
            </div>
           <div class="row">
                  <div class="col-lg-12">
                     <div class="panel panel-default"  style="padding: 15px;">

                        <div class="table-responsive">
                           <table id="datatable4" class="table table-striped">
                              <thead>
                                 <tr>
                                    <th key="firstname" class="translate EN" tyle="width:20%">First Name</th>
                                    <th key="lastname" class="translate EN" style="width:25%">Last Name</th>
                                    <th key="IDNum"  style="width:25%" class="translate EN">Insurance</th>
                                    <th key="dob" style="width:25%" class="translate EN">Date of birth</th>
                                    <th key="address" style="width:15%" class="translate EN">Adress</th>
                                    <th key="email" style="width:15%" class="translate EN">Email</th>
                                    <th key="phone" style="width:15%" class="translate EN">Phone Number</th>
                                      <th style="width:15%"></th>
                                      <th style="width:15%"></th>
                                      <th style="width:15%"></th>
                                 </tr>
                              </thead>
                              <tbody></tbody>
                           </table>
                        </div>
                     </div>
                  </div>
               </div>
         </div>
      </section>
      <!-- Page footer-->
      <footer>
         <span>&copy;2024-  CareIL</span>
      </footer>

    <div id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true" class="modal fade">
      <div class="modal-dialog">
         <div class="modal-content">
            <div class="modal-header">
               <button type="button" data-dismiss="modal" aria-label="Close" class="close">
                  <span aria-hidden="true">&times;</span>
               </button>
               <h4 key="path4" id="myModalLabel" class="modal-title translate EN">Client</h4>
            </div>
            <div class="modal-body">
               <form data-parsley-validate="" novalidate="" class="form-horizontal" id="detailform">
                           <div class="form-group">
                              <label key="firstname" class="col-lg-2 control-label translate EN">First Name</label>
                              <div class="col-lg-10">
                                 <input required type="text" name="pat_first_name" class="form-control" placeholder="First Name">
                              </div>
                           </div>
                           <div class="form-group">
                              <label key="lastname" class="col-lg-2 control-label translate EN">Last name</label>
                              <div class="col-lg-10">
                                 <input required type="text" name="pat_last_name" class="form-control" placeholder="Last name">
                              </div>
                           </div>
                   <div class="form-group">
                              <label key="IDNum" class="col-lg-2 control-label translate EN">Patien ID No</label>
                              <div class="col-lg-10">
                                 <input id="zehutinput" required type="text" name="pat_insurance_no"  class="form-control" placeholder="Insurance No">
                                 <p class="error" id="invalid_zehutinput"></p>
                              </div>
                           </div>
                           <div class="form-group">
                              <label key="dob" class="col-lg-2 control-label translate EN">Date Of Birth</label>
                              <div class="col-lg-10">
                                 <input id="dob" required type="date" name="pat_dob"  class="form-control" placeholder="Date of Birth">
                              </div>
                           </div>
                   <div class="form-group">
                              <label key="phone" class="col-lg-2 control-label translate EN">Phone Number</label>
                              <div class="col-lg-10">
                                 <input required name="pat_ph_no" type="text" class="form-control" placeholder="Phone Number">
                              </div>
                           </div>
                           <div class="form-group">
                              <label key="email" class="col-lg-2 control-label translate EN">Email</label>
                              <div class="col-lg-10">
                                 <input id="emailinput"  type="text" name="pat_email" class="form-control" placeholder="Email">
                                 <p class="error" id="invalid_email"></p>
                              </div>
                           </div>
                           <div class="form-group">
                              <label key="address" class="col-lg-2 control-label translate EN">Address</label>
                              <div class="col-lg-10">
                                 <textarea  name="pat_address" class="form-control" placeholder="Address"></textarea>
                              </div>
                           </div>

                           <input type="hidden" id="lang" name="lang" value= />
                        </form>



            </div>
            <div class="modal-footer">
               <button key="closebtn" type="button" data-dismiss="modal" class="btn btn-default translate EN">Close</button>
               <button key="savebtn" id="savethepatient" type="button" class="btn btn-primary translate EN">Save changes</button>
            </div>
         </div>
      </div>
   </div>

      var my_lang = sessionStorage.getItem("lang");
